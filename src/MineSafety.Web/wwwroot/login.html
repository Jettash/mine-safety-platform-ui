<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · 魏家峁矿生产管控平台</title><link rel="stylesheet" href="/app.css"><script src="/auth.js" defer></script></head>
<body class="auth-page" data-auth="login"><header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-main">魏家峁矿生产管控平台</span></div></header>
<main class="auth-shell"><div class="auth-card"><h1>登录查询平台</h1><p>在矿区局域网查询车辆检测记录和统计报表。</p>
<form id="auth-form"><label for="username">账号</label><input id="username" name="username" value="admin" autocomplete="username" required maxlength="32"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="128"><button class="button primary" type="submit">登录</button><div class="auth-message" id="auth-message" role="status" aria-live="polite"></div></form></div></main></body></html>

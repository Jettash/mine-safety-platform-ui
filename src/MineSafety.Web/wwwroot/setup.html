<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首次设置 · 魏家峁矿生产管控平台</title><link rel="stylesheet" href="/app.css"><script src="/auth.js" defer></script></head>
<body class="auth-page" data-auth="setup"><header class="topbar"><div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-main">魏家峁矿生产管控平台</span></div></header>
<main class="auth-shell"><div class="auth-card"><h1>首次设置账号</h1><p>只需在服务器本机设置一次。密码至少 8 位，系统保存密码哈希。</p><form id="auth-form">
<label for="admin-password">管理员账号：admin</label><input id="admin-password" type="password" autocomplete="new-password" placeholder="设置管理员密码" required minlength="8" maxlength="128"><label for="admin-confirm">确认管理员密码</label><input id="admin-confirm" type="password" autocomplete="new-password" required minlength="8" maxlength="128"><hr>
<label for="viewer-password">查询账号：viewer</label><input id="viewer-password" type="password" autocomplete="new-password" placeholder="设置查询账号密码" required minlength="8" maxlength="128"><label for="viewer-confirm">确认查询账号密码</label><input id="viewer-confirm" type="password" autocomplete="new-password" required minlength="8" maxlength="128"><button class="button primary" type="submit">建立账号</button><div class="auth-message" id="auth-message" role="status" aria-live="polite"></div></form></div></main></body></html>
